/* Tailwind の出力のあとに置く、このアプリだけのスタイル。
   以前は App.html の <style> に直接書いてあった。生成物は css.html。 */
html, body {
  height: 100%; overflow: hidden;
  font-family: 'M PLUS Rounded 1c', sans-serif;
  background-color: #f8fafc; color: #334155;
  touch-action: manipulation; overscroll-behavior: none;
  line-height: 1.6; letter-spacing: 0.02em;
}
.hide-scrollbar::-webkit-scrollbar { display: none; }
.custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

@keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.animate-pop-in { animation: popIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

@keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
.animate-slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

.glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.6); }
.smooth-map-container { will-change: transform; transform-origin: center; }
/* モバイルブラウザのアドレスバーを除いた実表示領域に合わせる（100vh だと下が隠れる端末対策） */
.app-h { height: 100vh; height: 100dvh; }
/* 地図領域はブラウザ標準のパン/ズームを無効化し、アプリ側でドラッグ・ピンチを処理する */
.map-viewport { touch-action: none; }

@keyframes bouncePin { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
.animate-bounce-pin { animation: bouncePin 1s infinite ease-in-out; }
@keyframes shadowPulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(0.6); opacity: 0.15; } }
.animate-shadow-pulse { animation: shadowPulse 1s infinite ease-in-out; }

@media print {
  body { background: white !important; }
  .no-print { display: none !important; }
  .print-full { width: 100% !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; }
}
