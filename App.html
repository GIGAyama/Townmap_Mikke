<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>みっけ！</title>

    <!--
      === React / Tailwind / 書体（すべて自己ホスト）===
      生成物です。作り直すには npm ci && npm run build（書体は npm run build:fonts）。

      ⚠️ ここに CDN への <script> / <link> を戻さないこと。
         学校のフィルタが 1 本でも塞ぐと、画面が白いまま何も出ません。
         児童からは「壊れている」としか見えず、原因はアプリの外にあるので
         先生も追えません。

      ⚠️ @babel/standalone（約3MB）はもう読みません。1,856 行の JSX を
         「開くたびに」ブラウザの中で翻訳していたのをやめ、ビルド時に
         1 回だけ翻訳しています（原本は src/app.jsx）。

      ⚠️ 書体の収録は 700 の 1 ウェイト＋小学1〜2年の配当漢字までです。
         児童が入力した珍しい字は端末フォントに落ちます（豆腐にはなりません）。
    -->
    <?!= include_('vendor'); ?>
    <?!= include_('fonts'); ?>

    <!-- デザインシステム（色・書体・影の設定）の原本は tailwind.config.js に移しました。
         生成物は css.html です（Tailwind の出力＋ tools/extra.css）。 -->
    <?!= include_('css'); ?>

  </head>
  <body>
    <div id="root" class="h-full w-full"></div>

    <!-- 画面の中身。原本は src/app.jsx（ここは生成物 app.html を差し込むだけ） -->
    <?!= include_('app'); ?>

    <!-- 利用規約・プライバシーへの行き先。中身は正本の部品
         standards/web/giga-app-links.js（配布物 web/giga-app-links.js）を
         tools/build-app-links.mjs が焼き込んだもの。
         src/app.jsx のフッターに置いた <span data-giga-links> の中に出す。

         ⚠️ 画面の中身（include_('app')）より後に置くこと。フッターは React が
            描いてから現れるので、部品は置き場所が出てくるのを待って出す。
         ⚠️ slug は焼き込みのときに渡してある。GAS の画面はホスト名から
            自分が何のアプリか分からないため。 -->
    <?!= include_('giga_links'); ?>
  </body>
</html>
