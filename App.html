    <!-- 起動ビーコン（診断・シェル用 / 全モード共通・秘密情報は含まない）。
         CDN（React/Babel/Tailwind）より前に置いた素の JS なので、学校のフィルタで
         CDN がブロックされてアプリ本体が起動できない場合でも
         「GAS のページ自体は届いている・どの部品が読めていないか」を外側へ通知できる。 -->
    <script>
      (function () {
        var mode = '<?= bootMode ?>';
        var shellOrigin = '<?= bootShellOrigin ?>' || '*';
        var errors = [];
        window.addEventListener('error', function (ev) {
          try {
            var m = (ev && ev.message) ||
              (ev && ev.target && (ev.target.src || ev.target.href)) || 'unknown';
            if (errors.length < 5) errors.push(String(m).slice(0, 200));
          } catch (e) {}
        }, true);
        var n = 0;
        var send = function () {
          n++;
          var msg = {
            type: 'app:loaded',
            mode: mode,
            libs: {
              react: typeof React !== 'undefined',
              babel: typeof Babel !== 'undefined',
              tailwind: typeof tailwind !== 'undefined'
            },
            errors: errors.slice()
          };
          [window.parent, window.top, window.opener].forEach(function (w) {
            try { if (w && w !== window) w.postMessage(msg, shellOrigin); } catch (e) {}
          });
          if (n >= 10) clearInterval(iv);
        };
        var iv = setInterval(send, 800);
        send();
      })();
    </script>

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {

                bitIndex = 7;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];

        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);

        for (var i = 0; i < ecdata[r].length; i += 1) {

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {

            index += 1;
          }

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {

        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

              await sleep(600 * Math.pow(2, attempt) + Math.random() * 400);
              continue;
            }
            if (res.status === 'unregistered') return res; // legacy: 呼び出し元で処理
            const err = new Error(res.error || res.message || 'エラーが発生しました');
            err.code = res.code;
            throw err;
          }
          return res;
        }
      };

      // ポータル用（classCode を持たない tp* 呼び出し）
      const portalCall = async (fnName, ...args) => {
        const res = await runGas(fnName, ...args);
        if (res && res.success === false) {
          const err = new Error(res.error || res.message || 'エラーが発生しました');
          err.code = res.code;
          throw err;

        return res;

      // 記録系操作のモード差を吸収する

          if (action === 'save_pin') return api('Submit', { type: 'pin', ...data });
          if (action === 'save_chat') return api('Submit', { type: 'chat', ...data });

          if (action === 'update_pin') return api('UpdateMine', data.pin_id, data);
          if (action === 'delete_pin') return api('DeleteMine', data.pin_id);
          if (action === 'delete_chat') return api('DeleteMine', data.chat_id);
          throw new Error('この操作はできません');
        }
        return api('ExecuteAction', JSON.stringify({ action, ...data }));

      // Enter キー送信の共通ハンドラ。日本語 IME の変換確定 Enter では発火させない
      const onEnterKey = (fn) => (e) => {
        if (e.key === 'Enter' && !e.nativeEvent.isComposing) fn();

      const PIN_COLORS = ['#f43f5e', '#0ea5e9', '#eab308', '#22c55e', '#a855f7'];
      const REACTION_EMOJIS = ['👍'];

      const isPointInPolygon = (point, vs) => {
        let x = point.x, y = point.y, inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
          let xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
          let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      };

      const compressImage = async (file, maxDim = 600, quality = 0.7) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let w = img.width, h = img.height;
              if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } } else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject; img.src = e.target.result;
          };
          reader.onerror = reject; reader.readAsDataURL(file);
        });
      };

      const AppContext = createContext();

      // ==========================================
      // 画像(Images_画像シート)の遅延読込
      //   'imgref:xxx' → api('GetImage') で Data URL に解決（メモリキャッシュ付き）
      // ==========================================
      const imageCache = new Map();
      const resolveImage = (api, src) => {
        if (!src || typeof src !== 'string' || !src.startsWith('imgref:')) return Promise.resolve(src);
        if (imageCache.has(src)) return Promise.resolve(imageCache.get(src));
        const p = api('GetImage', src).then(r => {
          const d = (r && r.dataUrl) || '';
          imageCache.set(src, d);
          return d;
        }).catch(() => { imageCache.delete(src); return ''; });
        imageCache.set(src, p);
        return p;
      };

      const useResolvedImage = (src) => {
        const { api } = useContext(AppContext);
        const isRef = src && typeof src === 'string' && src.startsWith('imgref:');
        const [url, setUrl] = useState(isRef ? null : src);
        useEffect(() => {
          let alive = true;
          if (src && typeof src === 'string' && src.startsWith('imgref:')) {
            setUrl(null);
            Promise.resolve(resolveImage(api, src)).then(u => { if (alive) setUrl(u); });
          } else {
            setUrl(src);
          }
          return () => { alive = false; };
        }, [src]);
        return url;
      };

      const SmartImg = ({ src, className, ...props }) => {
        const url = useResolvedImage(src);
        if (!url) return <div className={(className || '') + ' bg-slate-100 animate-pulse'} />;

      };

      // 写真アップロードボタン（Drive 不使用。圧縮して Images シートへ保存）
      const ImageUploadButton = ({ onDone, maxDim = 600, quality = 0.7, className, children }) => {

        const inputRef = useRef(null);
        const [busy, setBusy] = useState(false);
        const handleFile = async (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = '';
          if (!file) return;
          setBusy(true);
          try {
            let dataUrl = await compressImage(file, maxDim, quality);
            if (dataUrl.length > 380000) dataUrl = await compressImage(file, Math.round(maxDim * 0.7), 0.55);
            if (dataUrl.length > 380000) throw new Error('画像が大きすぎます');
            const res = await api('UploadImage', dataUrl);
            imageCache.set(res.imageRef, dataUrl);
            onDone(res.imageRef);
          } catch (err) {
            showToast(err.message || '画像の保存に失敗しました', 'error');
          }
          setBusy(false);
        };

          <React.Fragment>
            <button onClick={() => inputRef.current && inputRef.current.click()} disabled={busy} className={className}>

          const existing = myReactions.find(r => r.email === state.user.email && r.emoji === emoji);

            dispatch(p => ({...p, reactions: p.reactions.filter(r => r !== existing)}));

            const newReaction = { reaction_id: 'r_temp_'+Date.now(), unit_id: state.activeUnit.unit_id, email: state.user.email, target_type: targetType, target_id: targetId, emoji };

          try { await doAction('toggle_reaction', { unit_id: state.activeUnit.unit_id, target_type: targetType, target_id: targetId, emoji }); }
          catch(e) { /* 次回の同期で整合する */ }
        };

        const counts = {};
        myReactions.forEach(r => { counts[r.emoji] = (counts[r.emoji] || 0) + 1; });

        return (
          <div className="flex gap-2 items-center flex-wrap">

            if (isEdit) {

                </div>
