<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>みっけ！ 接続診断</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f8fafc; color: #334155; padding: 16px; line-height: 1.7; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 16px; }
    .step { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; }
    .step .name { font-weight: 700; }
    .step .detail { font-size: 12px; color: #64748b; word-break: break-all; }
    .ok { border-left: 6px solid #10b981; }
    .ng { border-left: 6px solid #f43f5e; }
    .wait { border-left: 6px solid #f59e0b; }
    .frames { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
    .framebox { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; }
    .framebox p { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    iframe { width: 100%; height: 240px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    button { font-family: inherit; font-weight: 700; font-size: 14px; padding: 12px 20px; border: 0; border-radius: 10px; cursor: pointer; margin: 4px 4px 4px 0; }
    .primary { background: #0ea5e9; color: #fff; }
    .danger { background: #f43f5e; color: #fff; }
    .plain { background: #e2e8f0; color: #334155; }
    #summary { background: #1e293b; color: #e2e8f0; border-radius: 12px; padding: 12px 14px; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>🔍 みっけ！ 接続診断</h1>
  <p class="sub">このページを開くだけで、児童用アプリにつながらない原因を自動でしらべます。結果（下の黒い欄）をコピーして開発者に送ってください。</p>

  <div id="steps"></div>

  <div class="frames">
    <div class="framebox">
      <p>テストA: 素のURL（パラメータなし・Cookieなし）＝新方式</p>
      <iframe id="frameA" allow="clipboard-read; clipboard-write"></iframe>
    </div>
    <div class="framebox">
      <p>テストB: クラスコード付きURL（Cookieなし）＝旧方式</p>
      <iframe id="frameB" allow="clipboard-read; clipboard-write"></iframe>
    </div>
    <div class="framebox">
      <p>テストC: クラスコード付きURL（通常・Cookieあり）</p>
      <iframe id="frameC" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </div>

  <button class="primary" id="copy">📋 結果をコピー</button>
  <button class="danger" id="reset">🧹 キャッシュを全部消して再読み込み</button>
  <button class="plain" onclick="location.reload()">🔄 もう一度診断</button>

  <div id="summary">診断中...</div>

  <script src="config.js"></script>
  <script>
  (function () {
    'use strict';
    var CFG = window.APP_CONFIG || {};
    var TIMEOUT_MS = 15000;
    var results = {};
    var stepsEl = document.getElementById('steps');

    var params = new URLSearchParams(location.search);
    var classCode = String(params.get('c') || '').replace(/[^A-Z2-9]/gi, '').toUpperCase().slice(0, 16) || 'AAAAAAAA';

    function setStep(id, status, name, detail) {
      results[id] = { status: status, name: name, detail: detail || '' };
      var div = document.getElementById('step-' + id);
      if (!div) {
        div = document.createElement('div');
        div.id = 'step-' + id;
        stepsEl.appendChild(div);
      }
      var mark = status === 'ok' ? '✅' : status === 'ng' ? '❌' : '⏳';
      div.className = 'step ' + (status === 'ok' ? 'ok' : status === 'ng' ? 'ng' : 'wait');
      div.innerHTML = '<span class="name">' + mark + ' ' + name + '</span><div class="detail">' + (detail || '') + '</div>';
      renderSummary();
    }

    function renderSummary() {
      var lines = ['--- みっけ！接続診断 ' + new Date().toISOString() + ' ---'];
      lines.push('UA: ' + navigator.userAgent);
      lines.push('URL: ' + location.href);
      Object.keys(results).forEach(function (k) {
        var r = results[k];
        lines.push('[' + (r.status === 'ok' ? 'OK' : r.status === 'ng' ? 'NG' : '..') + '] ' + r.name + (r.detail ? ' | ' + r.detail : ''));
      });
      document.getElementById('summary').textContent = lines.join('\n');
    }

    document.getElementById('copy').addEventListener('click', function () {
      var t = document.getElementById('summary').textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
        function(){ alert('コピーしました'); },
        function(){ prompt('コピーしてください', t); });
    });

    // 🧹 SW とキャッシュを完全に消す（古いシェルが配られ続ける問題の解消）
    document.getElementById('reset').addEventListener('click', function () {
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.all(jobs).then(function () {
        alert('キャッシュを削除しました。ページを再読み込みします。');
        location.reload();
      });
    });

    // ── 1. 設定 ──
    if (CFG.execUrlS && CFG.googleClientId) {
      setStep('config', 'ok', '設定ファイル(config.js)', 'execUrlS: ...' + CFG.execUrlS.slice(-20));
    } else {
      setStep('config', 'ng', '設定ファイル(config.js)', 'execUrlS または googleClientId が空です');
      return;
    }

    // ── 2. シェルのバージョン（Service Worker / キャッシュ） ──
    setStep('sw', 'wait', 'シェルのキャッシュ状態', '確認中...');
    var swInfo = [];
    var swJobs = [];
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      swJobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        swInfo.push('SW登録数=' + regs.length);
        swInfo.push('制御中=' + (navigator.serviceWorker.controller ? 'はい' : 'いいえ'));
      }));
    }
    if (window.caches && caches.keys) {
      swJobs.push(caches.keys().then(function (keys) { swInfo.push('キャッシュ=' + (keys.join(',') || 'なし')); }));
    }
    Promise.all(swJobs).then(function () {
      // 最新キャッシュ名（docs/sw.js の CACHE_NAME）以外の mikke-shell-* が残っていたら古い
      var CURRENT_CACHE = 'mikke-shell-v5';
      var joined = swInfo.join(' / ');
      var stale = /mikke-shell-v\d+/.test(joined) && joined.indexOf(CURRENT_CACHE) < 0 ||
        ['v1', 'v2', 'v3', 'v4'].some(function (v) { return joined.indexOf('mikke-shell-' + v) >= 0; });
      setStep('sw', stale ? 'ng' : 'ok', 'シェルのキャッシュ状態',
        swInfo.join(' / ') + (stale ? ' → 古いシェルが残っています。「キャッシュを全部消して再読み込み」を押してください' : ''));
    }).catch(function (e) { setStep('sw', 'ok', 'シェルのキャッシュ状態', '確認不可: ' + e); });

    // ── 2.5 サーバー設定の自動判定（?diag=1 エンドポイント） ──
    // Cookie なしの fetch でこの JSON が読めた時点で「デプロイ S は匿名アクセス可
    // （アクセスできるユーザー: 全員）」が確定する。ログイン必須設定だと Google が
    // accounts.google.com へリダイレクトするため fetch が失敗する。
    setStep('srv', 'wait', 'デプロイSのサーバー設定', '確認中...');
    (function () {
      var diagUrl = CFG.execUrlS + (CFG.execUrlS.indexOf('?') >= 0 ? '&' : '?') + 'diag=1';
      fetch(diagUrl, { credentials: 'omit' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.ok) { setStep('srv', 'ng', 'デプロイSのサーバー設定', '想定外の応答: ' + JSON.stringify(j).slice(0, 200)); return; }
          var problems = [];
          if (j.deployKind === 'T') problems.push('「次のユーザーとして実行」が「自分」になっていません（児童の読み書きができません）');
          if (!j.config || !j.config.appAccount) problems.push('ScriptProperties の sp_appAccountEmail が未設定です');
          if (!j.config || !j.config.clientId) problems.push('ScriptProperties の sp_googleClientId が未設定です（トークン検証が全滅します）');
          var shellUrl = (j.config && j.config.shellUrl) || '';
          if (!shellUrl) {
            problems.push('ScriptProperties の sp_shellUrl が未設定です');
          } else {
            var m = shellUrl.match(/^(https?:\/\/[^\/]+)/);
            if (m && m[1].toLowerCase() !== location.origin.toLowerCase()) {
              problems.push('sp_shellUrl のオリジン（' + m[1] + '）がこのページ（' + location.origin + '）と一致しません → ハンドシェイクが全て無視されます');
            }
          }
          if (problems.length) setStep('srv', 'ng', 'デプロイSのサーバー設定', problems.join(' / '));
          else setStep('srv', 'ok', 'デプロイSのサーバー設定', '匿名アクセス可・実行者=アプリアカウント・設定OK（schema v' + j.schemaVersion + '）');
        })
        .catch(function (e) {
          setStep('srv', 'ng', 'デプロイSのサーバー設定',
            'Cookie なしで接続できません。原因の可能性: ①「アクセスできるユーザー」が「全員」になっていない（ログイン必須のため児童用画面では表示不可） ' +
            '②GAS 側コードが古く ?diag=1 に未対応 ③フィルタが script.google.com を遮断。詳細: ' + e);
        });
    })();

    // ── 2.6 アプリ部品（CDN）の到達性 ──
    // アプリ本体は unpkg.com（React/Babel）と cdn.tailwindcss.com に依存する。
    // 学校のフィルタでこれらが遮断されていると、GAS のページは表示できても
    // アプリが起動しない（＝真っ白 / 応答なし）
    ;[
      { id: 'cdn1', name: 'アプリ部品: unpkg.com (React)', url: 'https://unpkg.com/react@18/umd/react.production.min.js' },
      { id: 'cdn2', name: 'アプリ部品: cdn.tailwindcss.com', url: 'https://cdn.tailwindcss.com' }
    ].forEach(function (c) {
      setStep(c.id, 'wait', c.name, '確認中...');
      var s2 = document.createElement('script');
      s2.src = c.url; s2.async = true;
      s2.onload = function () { setStep(c.id, 'ok', c.name, '到達できます'); };
      s2.onerror = function () { setStep(c.id, 'ng', c.name, '遮断されています（学校のフィルタの可能性）。このドメインの許可をネットワーク管理者に依頼してください'); };
      document.head.appendChild(s2);
    });

    // ── 3. credentialless 対応 ──
    var credSupported = ('credentialless' in HTMLIFrameElement.prototype);
    setStep('cred', credSupported ? 'ok' : 'ng', 'Cookieなし読込(credentialless)への対応',
      credSupported ? 'このブラウザは対応しています' : '非対応ブラウザです（テストAは通常読込と同じになります）');

    // ── 4. iframe 読み込みテスト ──
    //  A: 素URL + credentialless（新方式。クラスコードはハンドシェイクで渡す）
    //  B: パラメータ付きURL + credentialless（旧方式）
    //  C: パラメータ付きURL + 通常iframe（Cookieあり）
    var bareUrl = CFG.execUrlS;
    var paramUrl = CFG.execUrlS + (CFG.execUrlS.indexOf('?') >= 0 ? '&' : '?') + 'mode=student&c=' + encodeURIComponent(classCode);
    var TESTS = {
      A: { url: bareUrl, name: 'テストA: 素のURL(パラメータなし・Cookieなし)', cred: true,
           hint: 'GAS側の App.html が最新でない場合、枠内にアプリが見えていてもNG表示になります' },
      B: { url: paramUrl, name: 'テストB: クラスコード付きURL(Cookieなし)', cred: true, hint: '' },
      C: { url: paramUrl, name: 'テストC: クラスコード付きURL(Cookieあり)', cred: false, hint: '' }
    };
    var t0 = Date.now();
    var done = {};
    var frames = {};
    var loaded = {};   // app:loaded（起動ビーコン）の受信内容

    Object.keys(TESTS).forEach(function (key) {
      var t = TESTS[key];
      var f = document.getElementById('frame' + key);
      frames[key] = f;
      if (t.cred) { try { f.setAttribute('credentialless', ''); } catch (e) {} }
      setStep('frame' + key, 'wait', t.name, '読み込み中...');
      f.src = t.url;
      setTimeout(function () {
        if (done[key]) return;
        done[key] = true;
        var li = loaded[key];
        if (li && li.libs && !li.libs.react) {
          setStep('frame' + key, 'ng', t.name,
            'ページ自体は届きましたが、アプリの部品（unpkg.com の React）が読み込めず起動できません。上の「アプリ部品」の結果を確認してください。' +
            (li.errors && li.errors.length ? ' 検出エラー: ' + li.errors.join(' / ') : ''));
        } else if (li) {
          setStep('frame' + key, 'ng', t.name,
            'ページには到達しました（mode=' + (li.mode || '?') + '）が、アプリの起動完了(app:ready)まで進みません。' + (t.hint || ''));
        } else {
          setStep('frame' + key, 'ng', t.name,
            TIMEOUT_MS / 1000 + '秒待ちましたがページから何の応答もありません。枠内の表示（「ファイルを開くことができません」やログイン画面かどうか）を確認してください。' + (t.hint || ''));
        }
      }, TIMEOUT_MS);
    });

    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (d.type !== 'app:ready' && d.type !== 'app:loaded') return;
      var okOrigin = ev.origin === 'https://script.google.com' ||
        /^https:\/\/[a-z0-9][a-z0-9-]*(\.[a-z0-9][a-z0-9-]*)*\.googleusercontent\.com$/i.test(ev.origin);
      if (!okOrigin) return;
      var ms = (Date.now() - t0);
      Object.keys(TESTS).forEach(function (key) {
        if (!frames[key].contentWindow || ev.source !== frames[key].contentWindow) return;
        if (d.type === 'app:loaded') {
          loaded[key] = d;
          if (!done[key]) {
            setStep('frame' + key, 'wait', TESTS[key].name,
              'ページ到達（mode=' + (d.mode || '?') + ' / React=' + (d.libs && d.libs.react ? 'OK' : '未') + '）。アプリ起動を待っています...');
          }
          return;
        }
        if (!done[key]) {
          done[key] = true;
          setStep('frame' + key, 'ok', TESTS[key].name, ms + 'ms で応答（正常・' + d.type + (d.mode ? '/' + d.mode : '') + '）');
        }
      });
    });

    // ── 5. GIS（サインイン部品）読み込み ──
    setStep('gis', 'wait', 'Google サインイン部品(GIS)の読み込み', '...');
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = function () { setStep('gis', 'ok', 'Google サインイン部品(GIS)の読み込み', '正常'); };
    s.onerror = function () { setStep('gis', 'ng', 'Google サインイン部品(GIS)の読み込み', 'accounts.google.com に接続できません（フィルタリングの可能性）'); };
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>
