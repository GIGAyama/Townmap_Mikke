<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <!-- インストールの合図を「いちばん先に」受け取る。
       Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
       この下の読み込みより後だと合図を取りこぼし、通信が遅い端末で
       「アプリを入れる」ボタンが出なくなる。 -->
  <script src="pwa-install-hook.js"></script>

  <!-- viewport-fit=cover … ノッチやホームバーの領域まで背景を伸ばすために必須 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>みっけ！</title>
  <meta name="description" content="地図の上に見つけたものを書き込んで共有する、協働学習向けのアプリ。なぞって範囲を選ぶツールや、Gemini によるポートフォリオの自動生成を備えます。Google Apps Script と React で構築。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GIGA school">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="みっけ！">
  <meta property="og:description" content="地図の上に見つけたものを書き込んで共有する、協働学習向けのアプリ。なぞって範囲を選ぶツールや、Gemini によるポートフォリオの自動生成を備えます。Google Apps Script と React で構築。">
  <meta property="og:url" content="https://townmap-mikke.giga-school.com/">
  <meta property="og:image" content="https://giga-school.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0ea5e9" />
  <!-- 児童用アプリなので配色は固定する（端末のダークモードで反転すると混乱する） -->
  <meta name="color-scheme" content="light" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <!-- iOS は SVG も maskable も扱えないので、専用の PNG を渡す。
       これが無いとホーム画面に追加したときアイコンが出ない。 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="みっけ！" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ノッチ・ホームバー・丸角のぶんの余白 */
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);

      /* 画面幅に応じて伸び縮みする文字サイズ。
         320px のスマホから 4K の電子黒板まで1本の式でまかなう。 */
      --fs-body: clamp(14px, 1.2vw + 9px, 17px);
      --fs-note: clamp(13px, 1vw + 8px, 15px);
      --fs-title: clamp(22px, 3vw + 12px, 34px);

      /* 面に置く色と、文字に使う色を分ける。明るい水色をそのまま
         白文字の下地にすると、Chromebook の安価な液晶では読めない。 */
      --sky: #0ea5e9;      /* 面・帯・アクセント用 */
      --sky-d: #0369a1;    /* 白文字を載せる面／濃い文字用（白背景で 5.4:1） */
      --ink: #1e293b;
      --muted: #475569;    /* 白背景で 8.6:1。旧 #64748b は 12px では厳しかった */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html {
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      height: 100%;
    }
    body {
      /* 100vh はモバイルのアドレスバーぶんだけはみ出す。dvh を使う。 */
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'BIZ UDGothic',
        'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
      background: #f8fafc; color: #334155;
      font-size: var(--fs-body); line-height: 1.8;
      display: flex; flex-direction: column;
      /* 横向きのときにノッチ側で UI が欠けるのを防ぐ */
      padding-left: var(--safe-l); padding-right: var(--safe-r);
    }
    #app-frame {
      border: 0; width: 100%; height: 100%; flex: 1; display: none; background: #f8fafc;
    }
    .gate {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
      overflow: auto; overscroll-behavior: contain;
    }
    .card {
      background: #fff; border-radius: 32px;
      padding: clamp(28px, 6vw, 40px) clamp(20px, 5vw, 32px);
      text-align: center; max-width: 420px; width: 100%;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,.12);
      border-top: 10px solid var(--sky);
    }
    .card .emoji { font-size: clamp(48px, 12vw, 64px); display: block; margin-bottom: 16px; }
    .card h1 { font-size: var(--fs-title); font-weight: 800; color: var(--ink); margin-bottom: 8px; letter-spacing: .02em; }
    .card p { font-size: var(--fs-note); color: var(--muted); line-height: 1.8; margin-bottom: 20px; }
    .card .note {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px;
      padding: 14px; font-size: var(--fs-note); color: var(--muted); text-align: left; line-height: 1.8;
    }
    #gsi-button { display: flex; justify-content: center; margin-bottom: 16px; min-height: 44px; }
    .btn {
      display: inline-block; background: var(--sky-d); color: #fff; border: 0; cursor: pointer;
      font-family: inherit; font-weight: 700; font-size: var(--fs-body);
      /* 低学年の指でも押せる大きさを下限にする */
      min-height: 48px; min-width: 44px;
      padding: 12px 28px; border-radius: 14px;
      box-shadow: 0 10px 40px -10px rgba(3,105,161,.5);
      text-decoration: none; transition: background .2s;
      /* ダブルタップズームの300ms遅延を消す */
      touch-action: manipulation;
    }
    .btn:hover { background: #075985; }
    .btn.secondary { background: var(--ink); box-shadow: none; }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    #install-app {
      background: #fff; color: var(--sky-d); border: 2px solid #bae6fd;
      box-shadow: none; margin-top: 12px;
    }
    #install-app:hover { background: #f0f9ff; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 4px solid #e0f2fe; border-top-color: var(--sky); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    #overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
      z-index: 50;
    }

    /* 更新のお知らせ帯（スクリプトが差し込む）。
       下端に固定するので、ホームバーのぶんを足す。 */
    #sw-update-banner {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(16px + var(--safe-b)); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      gap: 12px; flex-wrap: wrap;
      max-width: calc(100vw - 32px);
      padding: 12px 16px;
      background: var(--ink); color: #fff;
      border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
      font-weight: 700; font-size: var(--fs-note); line-height: 1.5;
    }
    #sw-update-banner button {
      min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px;
      font: inherit; cursor: pointer; touch-action: manipulation;
    }
    #sw-update-apply { background: #38bdf8; color: var(--ink); }
    #sw-update-close { background: transparent; color: #cbd5e1; }
    #sw-update-banner button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    /* 感覚過敏の児童に配慮して、動きを止められるようにする */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* 背景色が無効化されても「押せる」と分かるようにする */
    @media (forced-colors: active) {
      .btn, #sw-update-banner button { border: 2px solid ButtonText; }
    }
  </style>
</head>
<body>
  <!-- 起動ゲート（サインイン前 / 接続中） -->
  <div class="gate" id="gate">
    <div class="card">
      <span class="emoji">🗺️</span>
      <h1>みっけ！</h1>
      <div id="gate-loading">
        <div class="spinner"></div>
        <p id="gate-status">じゅんびしています...</p>
      </div>
      <div id="gate-login" class="hidden">
        <p>Google アカウントでログインしてはじめよう</p>
        <div id="gsi-button"></div>
        <p class="note" id="login-note">学校の Google アカウントでサインインしてください。パスワードがこのアプリに渡ることはありません。</p>
        <!-- アドレスバーの小さなアイコンは児童には見つけられないので、
             インストールできる状態のときだけここにボタンを出す -->
        <button type="button" class="btn hidden" id="install-app">📲 アプリを入れる</button>
      </div>
      <div id="gate-fallback" class="hidden">
        <p>うまくつながらないみたい…<br>下のボタンでひらくと、ひらいた<strong>先のタブでそのまま</strong>つかえるよ。<br>（この画面はとじないでね）</p>
        <button class="btn" id="open-newtab">べつのタブでひらく</button>
        <a class="btn secondary" id="open-diag" href="diag.html" style="margin-left:8px;">🔍 接続診断</a>
        <p class="note" id="fallback-url" style="margin-top:16px; word-break:break-all; white-space:pre-line;"></p>
      </div>
      <div id="gate-config-error" class="hidden">
        <p style="color:#e11d48; font-weight:700;">セットアップが完了していません。<br>docs/config.js の execUrlT / execUrlS / googleClientId を設定してください。</p>
      </div>
    </div>
  </div>

  <!-- トークン再取得が必要になった時のオーバーレイ -->
  <div id="overlay" class="hidden">
    <div class="card">
      <span class="emoji">🔑</span>
      <h1>もういちどログイン</h1>
      <p>あんぜんのため、ときどきログインのかくにんが必要だよ。</p>
      <div id="gsi-button-overlay" style="display:flex; justify-content:center;"></div>
    </div>
  </div>

  <iframe id="app-frame" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <script src="config.js"></script>
  <script>
  (function () {
    'use strict';
    var CFG = window.APP_CONFIG || {};
    var TOKEN_KEY = 'mikke_id_token'; // sessionStorage のみ（localStorage には置かない）
    var READY_TIMEOUT_MS = 12000;

    // ── ルーティング: ?c= の有無で教員 / 児童を出し分け ──
    var params = new URLSearchParams(location.search);
    var classCode = String(params.get('c') || '').replace(/[^A-Z2-9]/gi, '').toUpperCase().slice(0, 16);
    var mode = classCode ? 'student' : 'teacher';

    var frame = document.getElementById('app-frame');
    var gate = document.getElementById('gate');
    var el = function (id) { return document.getElementById(id); };

    // 児童用デプロイSは匿名アクセス前提（本人確認は ID トークンで行う）。
    // ブラウザにログイン中の Google アカウント（学校の管理アカウント等）の Cookie が
    // iframe に付くと、そのアカウント側のポリシーで GAS へのアクセスがブロックされる
    // ことがあるため、児童モードでは Cookie を一切送らない credentialless iframe で
    // 読み込む（Chrome / Edge / Chromebook で有効。未対応ブラウザでは無視されるが、
    // Safari 等はもともと第三者 Cookie を送らないため同じく匿名アクセスになる）。
    // 教員モード（デプロイT）は Session による本人特定に Cookie が必要なので付けない。
    if (mode === 'student') {
      try { frame.setAttribute('credentialless', ''); } catch (e) {}
    }

    var state = {
      gisReady: false,
      appReady: false,       // iframe から app:ready を受信済みか
      loadedInfo: null,      // iframe から app:loaded（起動ビーコン）を受信していれば内容
      frameBooted: false,
      readyTimer: null,
      needTokenPending: false
    };

    function show(section) {
      ['gate-loading', 'gate-login', 'gate-fallback', 'gate-config-error'].forEach(function (id) {
        el(id).classList.toggle('hidden', id !== section);
      });
    }
    function setStatus(t) { el('gate-status').textContent = t; }

    if (!CFG.execUrlT || !CFG.execUrlS || !CFG.googleClientId) {
      show('gate-config-error');
      return;
    }

    // ── ID トークンの保持（sessionStorage / 約1時間で失効） ──
    function decodeExp(jwt) {
      try {
        var payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        return Number(payload.exp) || 0;
      } catch (e) { return 0; }
    }
    function saveToken(jwt) {
      try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: jwt, exp: decodeExp(jwt) })); } catch (e) {}
    }
    function getToken() {
      try {
        var raw = sessionStorage.getItem(TOKEN_KEY);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        // 失効 60 秒前から「期限切れ」とみなす
        if (!obj.t || obj.exp * 1000 < Date.now() + 60000) return null;
        return obj.t;
      } catch (e) { return null; }
    }

    // ── GIS (Google Identity Services) ──
    function onCredential(response) {
      if (!response || !response.credential) return;
      saveToken(response.credential);
      el('overlay').classList.add('hidden');
      bootFrame();
      deliverToken(); // iframe が待っていれば即配送
    }

    window.__gisLoaded = function () {
      state.gisReady = true;
      google.accounts.id.initialize({
        client_id: CFG.googleClientId,
        callback: onCredential,
        auto_select: true,
        itp_support: true
      });
      if (getToken()) {
        bootFrame();
      } else {
        // まずはサイレント取得（One Tap）。出せなければログインボタンを表示
        show('gate-login');
        renderButton('gsi-button');
        try {
          google.accounts.id.prompt();
        } catch (e) {}
      }
    };

    function renderButton(containerId) {
      try {
        google.accounts.id.renderButton(el(containerId), {
          type: 'standard', theme: 'filled_blue', size: 'large',
          text: 'signin_with', shape: 'pill', locale: 'ja'
        });
      } catch (e) {}
    }

    function requestFreshToken() {
      // 期限切れ時の再取得。auto_select が効けばユーザー操作なしで onCredential が呼ばれる
      try { google.accounts.id.prompt(function (n) {
        if (n && (n.isNotDisplayed && n.isNotDisplayed() || n.isSkippedMoment && n.isSkippedMoment())) {
          // サイレント再取得に失敗 → 再ログイン UI
          el('overlay').classList.remove('hidden');
          renderButton('gsi-button-overlay');
        }
      }); } catch (e) {
        el('overlay').classList.remove('hidden');
        renderButton('gsi-button-overlay');
      }
    }

    // ── iframe 起動 ──
    // 児童モードは「素の exec URL」を優先する。クラスコード付き URL
    // (?mode=student&c=…) の iframe 読み込みを Google 側が拒否する環境が
    // 確認されているため、クラスコードは URL ではなく app:idToken メッセージで渡す。
    // 素 URL で応答が無い場合のみ、旧方式（パラメータ付き）を一度だけ試す。
    var frameVariant = 0; // 0: 素URL（新方式） / 1: パラメータ付き（旧方式フォールバック）
    function frameUrl() {
      if (mode === 'student') {
        if (frameVariant === 0) return CFG.execUrlS;
        return CFG.execUrlS + (CFG.execUrlS.indexOf('?') >= 0 ? '&' : '?') +
          'mode=student&c=' + encodeURIComponent(classCode);
      }
      return CFG.execUrlT + (CFG.execUrlT.indexOf('?') >= 0 ? '&' : '?') + 'portal=1';
    }

    function bootFrame() {
      gate.classList.add('hidden');
      frame.style.display = 'block';
      if (!state.frameBooted) {
        state.frameBooted = true;
        frame.src = frameUrl();
      }
      // 児童モードのみハンドシェイク必須。タイムアウトで別タブ動線へ
      if (mode === 'student') armReadyTimeout();
    }

    function reloadFrame() {
      state.appReady = false;
      frame.src = 'about:blank';
      setTimeout(function () { frame.src = frameUrl(); }, 50);
      if (mode === 'student') armReadyTimeout();
    }

    function armReadyTimeout() {
      clearTimeout(state.readyTimer);
      state.readyTimer = setTimeout(function () {
        if (state.appReady) return;
        // app:loaded（起動ビーコン）が届いていれば「URL の読み込み自体」は成功して
        // いるので、URL を変えて再試行しても意味がない。届いていない場合のみ
        // 旧方式（パラメータ付き）で一度だけ再試行する
        if (mode === 'student' && frameVariant === 0 && !state.loadedInfo) {
          frameVariant = 1;
          reloadFrame();
          return;
        }
        // GAS 側のログイン画面は iframe に出せないため、別タブで開かせて戻す
        gate.classList.remove('hidden');
        show('gate-fallback');
        try { el('open-diag').href = 'diag.html' + (classCode ? '?c=' + encodeURIComponent(classCode) : ''); } catch (e) {}
        diagnoseFailure();
      }, READY_TIMEOUT_MS);
    }

    // ── 失敗原因の自動判定（fallback 画面の下部に表示） ──
    // 判定材料:
    //   1. app:loaded ビーコン … 届いていれば「GAS のページは iframe に読み込めている」。
    //      libs.react=false なら CDN（unpkg 等）が学校のフィルタでブロックされている可能性が高い
    //   2. ?diag=1 の fetch … 成功すれば「デプロイ S は匿名アクセス可」。deployKind='T' なら
    //      実行するユーザーの設定ミス。fetch 失敗（CORS/リダイレクト）なら
    //      「アクセスできるユーザーが全員になっていない（ログイン必須）」か「フィルタで遮断」
    function diagnoseFailure() {
      var lines = ['接続先: ' + frameUrl()];
      var hintEl = el('fallback-url');
      function render() { hintEl.textContent = lines.join('\n\n'); }
      var info = state.loadedInfo;
      if (info) {
        if (info.libs && !info.libs.react) {
          lines.push('【原因の可能性】アプリの部品（unpkg.com / cdn.tailwindcss.com）が学校のネットワークでブロックされています。ネットワーク管理者に上記ドメインの許可を依頼してください。');
          if (info.errors && info.errors.length) lines.push('検出されたエラー: ' + info.errors.join(' / '));
        } else {
          lines.push('アプリのページには到達していますが、起動が完了しません。「接続診断」で詳細を確認してください。');
        }
        render();
        return;
      }
      lines.push('アプリのページに到達できていません。原因を調べています...');
      render();
      var diagUrl = CFG.execUrlS + (CFG.execUrlS.indexOf('?') >= 0 ? '&' : '?') + 'diag=1';
      fetch(diagUrl, { credentials: 'omit' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          lines.pop();
          if (j && j.deployKind === 'T') {
            lines.push('【設定の問題／先生・管理者向け】児童用デプロイ（S）の「次のユーザーとして実行」が「自分」になっていません。GAS のデプロイ設定を確認してください。');
          } else if (j && j.ok) {
            lines.push('サーバーには接続できています（設定は正常の可能性が高い）。ページの表示だけが失敗しているため、「接続診断」で詳細を確認してください。');
          } else {
            lines.push('サーバーの応答が想定外です。「接続診断」で詳細を確認してください。');
          }
          render();
        })
        .catch(function () {
          lines.pop();
          lines.push('【原因の可能性／先生・管理者向け】\n① 児童用デプロイ（S）の「アクセスできるユーザー」が「全員」になっていない（ログインが必須になり、Cookie を送らない児童用画面では表示できません）\n② 学校のフィルタが script.google.com / googleusercontent.com を遮断している\n「接続診断」ページで自動判定できます。');
          render();
        });
    }

    el('open-newtab').addEventListener('click', function () {
      // noopener は付けない: 開いた先のアプリが window.opener（このシェル）へ
      // app:ready を送り、シェルがトークンとクラスコードを渡す（iframe が使えない
      // 環境でも、開いたタブ内でそのままアプリが使える）
      frameVariant = 0;
      window.open(frameUrl(), '_blank');
    });
    document.addEventListener('visibilitychange', function () {
      // 別タブから戻ってきたら iframe を貼り直して自動再試行
      if (document.visibilityState === 'visible' && state.frameBooted && !state.appReady && mode === 'student') {
        show('gate-loading');
        setStatus('もういちど つないでいます...');
        reloadFrame();
      }
    });

    // ── iframe との postMessage ハンドシェイク ──
    // GAS の Web アプリは script.google.com / *.googleusercontent.com 配下の iframe で動く。
    // それ以外のオリジンからのメッセージはすべて無視する（必須の防御線）
    function isAllowedOrigin(origin) {
      if (origin === 'https://script.google.com') return true;
      return /^https:\/\/[a-z0-9][a-z0-9-]*(\.[a-z0-9][a-z0-9-]*)*\.googleusercontent\.com$/i.test(origin);
    }

    var appPort = null; // { source, origin }

    function sendToApp(msg) {
      if (!appPort) return;
      try { appPort.source.postMessage(msg, appPort.origin); } catch (e) {}
    }

    function deliverToken() {
      var t = getToken();
      if (!t) { requestFreshToken(); return; }
      sendToApp({ type: 'app:idToken', idToken: t, classCode: classCode });
    }

    window.addEventListener('message', function (ev) {
      if (!isAllowedOrigin(ev.origin)) return;
      var d = ev.data || {};
      if (d.type === 'app:ready') {
        state.appReady = true;
        clearTimeout(state.readyTimer);
        gate.classList.add('hidden');
        frame.style.display = 'block';
        appPort = { source: ev.source, origin: ev.origin };
        sendToApp({ type: 'app:shellAck' });
        deliverToken();
      } else if (d.type === 'app:needToken') {
        appPort = appPort || { source: ev.source, origin: ev.origin };
        // 手元のトークンがまだ有効ならそのまま返し、無効なら再取得
        var t = getToken();
        if (t) sendToApp({ type: 'app:idToken', idToken: t, classCode: classCode });
        else requestFreshToken();
      } else if (d.type === 'app:loaded') {
        // 起動ビーコン: ページ到達の証拠と部品（CDN）の読み込み状況を保持
        if (!state.loadedInfo || (d.libs && d.libs.react)) state.loadedInfo = d;
      } else if (d.type === 'app:reload') {
        reloadFrame();
      }
    });

    // ── PWA ──
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // 新しい版が用意できたら、児童にも分かる言葉で知らせる。
          // 黙って切り替えると、地図に貼っている最中に画面が変わってしまう。
          reg.addEventListener('updatefound', function () {
            var sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', function () {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner(function () {
                  sw.postMessage({ type: 'SKIP_WAITING' });
                  location.reload();
                });
              }
            });
          });
        }).catch(function () {});
      });
    }

    // 更新のお知らせ帯。どの画面の上にも同じように乗せられるよう素の DOM で作る。
    function showUpdateBanner(onApply) {
      if (document.getElementById('sw-update-banner')) return;
      var bar = document.createElement('div');
      bar.id = 'sw-update-banner';
      bar.setAttribute('role', 'status');
      bar.setAttribute('aria-live', 'polite');
      bar.innerHTML =
        '<span>あたらしい バージョンが あります</span>' +
        '<button type="button" id="sw-update-apply">さいしんに する</button>' +
        '<button type="button" id="sw-update-close">あとで</button>';
      document.body.appendChild(bar);
      el('sw-update-apply').addEventListener('click', function () { bar.remove(); onApply(); });
      el('sw-update-close').addEventListener('click', function () { bar.remove(); });
    }

    // ── 「アプリを入れる」ボタン ──
    // ブラウザのアドレスバーにある小さなアイコンは児童には見つけられないので、
    // 合図が来たら画面の中にボタンを出す。合図の受け取り自体は
    // <head> 最上部の pwa-install-hook.js で済ませてある。
    var deferredInstall = window.__deferredInstallPrompt || null;
    function refreshInstallButton() {
      var btn = el('install-app');
      if (!btn) return;
      var standalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
      btn.classList.toggle('hidden', !deferredInstall || standalone);
    }
    window.addEventListener('pwa-installable', function () {
      deferredInstall = window.__deferredInstallPrompt;
      refreshInstallButton();
    });
    window.addEventListener('pwa-installed', function () {
      deferredInstall = null;
      refreshInstallButton();
    });
    if (el('install-app')) {
      el('install-app').addEventListener('click', function () {
        if (!deferredInstall) return;
        var p = deferredInstall;
        deferredInstall = null;
        window.__deferredInstallPrompt = null;
        refreshInstallButton();
        // 合図は一度きりしか使えない。失敗しても再表示はしない（二重に出ると混乱する）
        try { p.prompt(); } catch (e) { /* noop */ }
      });
    }
    refreshInstallButton();

    // ── GIS ローダー ──
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function () { window.__gisLoaded(); };
    s.onerror = function () {
      setStatus('Google への接続に失敗しました。通信環境を確認して再読み込みしてください。');
    };
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>
