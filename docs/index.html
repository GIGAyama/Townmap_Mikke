<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>みっけ！</title>
  <meta name="theme-color" content="#0ea5e9" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #f8fafc; color: #334155;
      display: flex; flex-direction: column;
    }
    #app-frame {
      border: 0; width: 100%; height: 100%; flex: 1; display: none; background: #f8fafc;
    }
    .gate {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 32px; padding: 40px 32px; text-align: center;
      max-width: 420px; width: 100%;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,.12);
      border-top: 10px solid #0ea5e9;
    }
    .card .emoji { font-size: 64px; display: block; margin-bottom: 16px; }
    .card h1 { font-size: 24px; font-weight: 800; color: #1e293b; margin-bottom: 8px; letter-spacing: .02em; }
    .card p { font-size: 13px; color: #64748b; line-height: 1.8; margin-bottom: 20px; }
    .card .note {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px;
      padding: 14px; font-size: 12px; color: #64748b; text-align: left; line-height: 1.8;
    }
    #gsi-button { display: flex; justify-content: center; margin-bottom: 16px; min-height: 44px; }
    .btn {
      display: inline-block; background: #0ea5e9; color: #fff; border: 0; cursor: pointer;
      font-family: inherit; font-weight: 700; font-size: 15px;
      padding: 14px 28px; border-radius: 14px;
      box-shadow: 0 10px 40px -10px rgba(14,165,233,.5);
      text-decoration: none; transition: background .2s;
    }
    .btn:hover { background: #0284c7; }
    .btn.secondary { background: #1e293b; box-shadow: none; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 4px solid #e0f2fe; border-top-color: #0ea5e9; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    #overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
  </style>
</head>
<body>
  <!-- 起動ゲート（サインイン前 / 接続中） -->
  <div class="gate" id="gate">
    <div class="card">
      <span class="emoji">🗺️</span>
      <h1>みっけ！</h1>
      <div id="gate-loading">
        <div class="spinner"></div>
        <p id="gate-status">じゅんびしています...</p>
      </div>
      <div id="gate-login" class="hidden">
        <p>Google アカウントでログインしてはじめよう</p>
        <div id="gsi-button"></div>
        <p class="note" id="login-note">学校の Google アカウントでサインインしてください。パスワードがこのアプリに渡ることはありません。</p>
      </div>
      <div id="gate-fallback" class="hidden">
        <p>うまくつながらないみたい…<br>べつのタブで一度ひらいてから、この画面にもどってきてね。</p>
        <button class="btn" id="open-newtab">べつのタブでひらく</button>
      </div>
      <div id="gate-config-error" class="hidden">
        <p style="color:#e11d48; font-weight:700;">セットアップが完了していません。<br>docs/config.js の execUrlT / execUrlS / googleClientId を設定してください。</p>
      </div>
    </div>
  </div>

  <!-- トークン再取得が必要になった時のオーバーレイ -->
  <div id="overlay" class="hidden">
    <div class="card">
      <span class="emoji">🔑</span>
      <h1>もういちどログイン</h1>
      <p>あんぜんのため、ときどきログインのかくにんが必要だよ。</p>
      <div id="gsi-button-overlay" style="display:flex; justify-content:center;"></div>
    </div>
  </div>

  <iframe id="app-frame" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <script src="config.js"></script>
  <script>
  (function () {
    'use strict';
    var CFG = window.APP_CONFIG || {};
    var TOKEN_KEY = 'mikke_id_token'; // sessionStorage のみ（localStorage には置かない）
    var READY_TIMEOUT_MS = 15000;

    // ── ルーティング: ?c= の有無で教員 / 児童を出し分け ──
    var params = new URLSearchParams(location.search);
    var classCode = String(params.get('c') || '').replace(/[^A-Z2-9]/gi, '').toUpperCase().slice(0, 16);
    var mode = classCode ? 'student' : 'teacher';

    var frame = document.getElementById('app-frame');
    var gate = document.getElementById('gate');
    var el = function (id) { return document.getElementById(id); };

    var state = {
      gisReady: false,
      appReady: false,       // iframe から app:ready を受信済みか
      frameBooted: false,
      readyTimer: null,
      needTokenPending: false
    };

    function show(section) {
      ['gate-loading', 'gate-login', 'gate-fallback', 'gate-config-error'].forEach(function (id) {
        el(id).classList.toggle('hidden', id !== section);
      });
    }
    function setStatus(t) { el('gate-status').textContent = t; }

    if (!CFG.execUrlT || !CFG.execUrlS || !CFG.googleClientId) {
      show('gate-config-error');
      return;
    }

    // ── ID トークンの保持（sessionStorage / 約1時間で失効） ──
    function decodeExp(jwt) {
      try {
        var payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        return Number(payload.exp) || 0;
      } catch (e) { return 0; }
    }
    function saveToken(jwt) {
      try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: jwt, exp: decodeExp(jwt) })); } catch (e) {}
    }
    function getToken() {
      try {
        var raw = sessionStorage.getItem(TOKEN_KEY);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        // 失効 60 秒前から「期限切れ」とみなす
        if (!obj.t || obj.exp * 1000 < Date.now() + 60000) return null;
        return obj.t;
      } catch (e) { return null; }
    }

    // ── GIS (Google Identity Services) ──
    function onCredential(response) {
      if (!response || !response.credential) return;
      saveToken(response.credential);
      el('overlay').classList.add('hidden');
      bootFrame();
      deliverToken(); // iframe が待っていれば即配送
    }

    window.__gisLoaded = function () {
      state.gisReady = true;
      google.accounts.id.initialize({
        client_id: CFG.googleClientId,
        callback: onCredential,
        auto_select: true,
        itp_support: true
      });
      if (getToken()) {
        bootFrame();
      } else {
        // まずはサイレント取得（One Tap）。出せなければログインボタンを表示
        show('gate-login');
        renderButton('gsi-button');
        try {
          google.accounts.id.prompt();
        } catch (e) {}
      }
    };

    function renderButton(containerId) {
      try {
        google.accounts.id.renderButton(el(containerId), {
          type: 'standard', theme: 'filled_blue', size: 'large',
          text: 'signin_with', shape: 'pill', locale: 'ja'
        });
      } catch (e) {}
    }

    function requestFreshToken() {
      // 期限切れ時の再取得。auto_select が効けばユーザー操作なしで onCredential が呼ばれる
      try { google.accounts.id.prompt(function (n) {
        if (n && (n.isNotDisplayed && n.isNotDisplayed() || n.isSkippedMoment && n.isSkippedMoment())) {
          // サイレント再取得に失敗 → 再ログイン UI
          el('overlay').classList.remove('hidden');
          renderButton('gsi-button-overlay');
        }
      }); } catch (e) {
        el('overlay').classList.remove('hidden');
        renderButton('gsi-button-overlay');
      }
    }

    // ── iframe 起動 ──
    function frameUrl() {
      var base, query;
      if (mode === 'student') {
        base = CFG.execUrlS;
        query = 'mode=student&c=' + encodeURIComponent(classCode);
      } else {
        base = CFG.execUrlT;
        query = 'portal=1';
      }
      return base + (base.indexOf('?') >= 0 ? '&' : '?') + query;
    }

    function bootFrame() {
      gate.classList.add('hidden');
      frame.style.display = 'block';
      if (!state.frameBooted) {
        state.frameBooted = true;
        frame.src = frameUrl();
      }
      // 児童モードのみハンドシェイク必須。タイムアウトで別タブ動線へ
      if (mode === 'student') armReadyTimeout();
    }

    function reloadFrame() {
      state.appReady = false;
      frame.src = 'about:blank';
      setTimeout(function () { frame.src = frameUrl(); }, 50);
      if (mode === 'student') armReadyTimeout();
    }

    function armReadyTimeout() {
      clearTimeout(state.readyTimer);
      state.readyTimer = setTimeout(function () {
        if (!state.appReady) {
          // GAS 側のログイン画面は iframe に出せないため、別タブで開かせて戻す
          gate.classList.remove('hidden');
          show('gate-fallback');
        }
      }, READY_TIMEOUT_MS);
    }

    el('open-newtab').addEventListener('click', function () {
      window.open(frameUrl(), '_blank', 'noopener');
    });
    document.addEventListener('visibilitychange', function () {
      // 別タブから戻ってきたら iframe を貼り直して自動再試行
      if (document.visibilityState === 'visible' && state.frameBooted && !state.appReady && mode === 'student') {
        show('gate-loading');
        setStatus('もういちど つないでいます...');
        reloadFrame();
      }
    });

    // ── iframe との postMessage ハンドシェイク ──
    // GAS の Web アプリは script.google.com / *.googleusercontent.com 配下の iframe で動く。
    // それ以外のオリジンからのメッセージはすべて無視する（必須の防御線）
    function isAllowedOrigin(origin) {
      if (origin === 'https://script.google.com') return true;
      return /^https:\/\/[a-z0-9][a-z0-9-]*(\.[a-z0-9][a-z0-9-]*)*\.googleusercontent\.com$/i.test(origin);
    }

    var appPort = null; // { source, origin }

    function sendToApp(msg) {
      if (!appPort) return;
      try { appPort.source.postMessage(msg, appPort.origin); } catch (e) {}
    }

    function deliverToken() {
      var t = getToken();
      if (!t) { requestFreshToken(); return; }
      sendToApp({ type: 'app:idToken', idToken: t, classCode: classCode });
    }

    window.addEventListener('message', function (ev) {
      if (!isAllowedOrigin(ev.origin)) return;
      var d = ev.data || {};
      if (d.type === 'app:ready') {
        state.appReady = true;
        clearTimeout(state.readyTimer);
        gate.classList.add('hidden');
        frame.style.display = 'block';
        appPort = { source: ev.source, origin: ev.origin };
        sendToApp({ type: 'app:shellAck' });
        deliverToken();
      } else if (d.type === 'app:needToken') {
        appPort = appPort || { source: ev.source, origin: ev.origin };
        // 手元のトークンがまだ有効ならそのまま返し、無効なら再取得
        var t = getToken();
        if (t) sendToApp({ type: 'app:idToken', idToken: t, classCode: classCode });
        else requestFreshToken();
      } else if (d.type === 'app:reload') {
        reloadFrame();
      }
    });

    // ── PWA ──
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }

    // ── GIS ローダー ──
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function () { window.__gisLoaded(); };
    s.onerror = function () {
      setStatus('Google への接続に失敗しました。通信環境を確認して再読み込みしてください。');
    };
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>
