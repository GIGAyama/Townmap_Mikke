<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="color-scheme" content="light" />
  <title>インターネットにつながっていません｜みっけ！</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    /* アプリ本体と同じ配色・同じ丸ゴシックにして、「壊れた」と思わせない。
       このページは圏外でも表示できる必要があるので、外部ファイルを
       一切読み込まず、端末に入っているフォントだけで組む。 */
    :root {
      --sky: #0ea5e9;
      --sky-d: #0369a1;
      /* 文字用（白背景で 4.5:1 以上） */
      --bg: #f8fafc;
      --ink: #1e293b;
      --muted: #475569;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      /* 古い端末向けフォールバック */
      min-height: 100dvh;
      padding: calc(24px + var(--safe-t)) calc(20px + var(--safe-r)) calc(24px + var(--safe-b)) calc(20px + var(--safe-l));
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'BIZ UDGothic',
        'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
      font-size: clamp(15px, 1.6vw + 10px, 18px);
      line-height: 1.8;
    }

    .card {
      background: #fff;
      border-radius: 32px;
      border-top: 10px solid var(--sky);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, .12);
      padding: clamp(28px, 5vw, 40px) clamp(20px, 4vw, 32px);
      max-width: 34rem;
      width: 100%;
      text-align: center;
    }

    .emoji {
      font-size: clamp(48px, 12vw, 64px);
      line-height: 1;
      display: block;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(20px, 3vw + 12px, 28px);
      margin: 0 0 12px;
      font-weight: 800;
    }

    p {
      margin: 0 0 8px;
      color: var(--muted);
    }

    .note {
      margin-top: 20px;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      text-align: left;
      font-size: .92em;
      color: var(--sky-d);
    }

    .note ul {
      margin: 8px 0 0;
      padding-left: 1.2em;
    }

    button {
      margin-top: 24px;
      min-width: 44px;
      min-height: 56px;
      padding: 0 32px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--sky-d);
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color .15s;
    }

    button:hover {
      background: #075985;
    }

    button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    @media (forced-colors: active) {
      button {
        border: 2px solid ButtonText;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <span class="emoji" aria-hidden="true">📡</span>
    <h1>いま インターネットに つながっていません</h1>
    <p>「みっけ！」は みんなの まちの じょうほうを やりとりするので、</p>
    <p>つながっていないと ひらけません。</p>

    <button type="button" onclick="location.reload()">もういちど ためす</button>

    <div class="note">
      <strong>つながらない ときは</strong>
      <ul>
        <li>Wi-Fi が オンに なっているか たしかめる</li>
        <li>きかいを いちど とじて、ひらきなおす</li>
        <li>それでも だめなら、せんせいに つたえる</li>
      </ul>
    </div>
  </main>
</body>

</html>
