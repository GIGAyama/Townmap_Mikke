# =====================================================================
# ci.yml — このリポジトリの最低限の点検
# =====================================================================
# このリポジトリには長らくワークフローが1本も無く、.gs を壊したまま
# push しても誰も気づけなかった（GAS は貼り付けて保存するまで構文誤りを
# 教えてくれない）。いまは次の4つを機械で見る:
#
#   1. SW の版  — 配信物を変えたのに版を上げ忘れていないか
#   2. syntax   — .gs / docs・tools・scripts 配下の .js が構文として壊れていないか
#   3. App.html — <script type="text/babel"> の JSX が構文として通るか
#                 （5,000 行近い JSX が、これまで何にも見られていなかった）
#   4. tests    — 偽 GAS の上で .gs をそのまま動かし、認可とシートの扱いを見る
#
# 1〜4 は `npm run check` にまとめてある。deploy.yml（正本）が反映の前に
# 探しにくる名前がこの `check` なので、**ここと本番反映で同じものが回る**。
#
# drift は「正本からコピーしたファイルが取り残されていないか」を別ジョブで見る。
# =====================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 依存を入れる
        run: npm ci --ignore-scripts
      - name: 点検（SW の版 / 構文 / App.html の JSX / テスト）
        run: npm run check

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
